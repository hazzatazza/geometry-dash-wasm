<script>
window.__gdScramjetOff=/[?&]noscramjet(=|&|$)/.test(location.search);

window.__gdProxyBases=(function(){
var d=[
"https://proxy.corsfix.com/?",
"https://corsproxy.io/?url=",
"https://api.allorigins.win/raw?url="
];
try{
var q=new URLSearchParams(location.search).get("proxy");
if(q){
try{localStorage.setItem("gdProxyBase",q);}catch(e){}
return[q];
}
var s=localStorage.getItem("gdProxyBase");
if(s)return[s].concat(d.filter(function(x){return x!==s;}));
}catch(e){}
return d;
})();

window.__gdProxyBase=window.__gdProxyBases[0];

window.__gdProxyPass=[
"googletagmanager","cloudflareinsights","jsdelivr","gstatic",
"googleapis","corsfix","corsproxy","allorigins"
];

window.__gdProxyTarget=function(u){
var k="/__proxy?url=";
if(typeof u!=="string")return null;

for(var b=0;b<window.__gdProxyBases.length;b++)
if(u.indexOf(window.__gdProxyBases[b])===0)return null;

var i=u.indexOf(k);

if(i>=0){
if(i>0){
try{
if(new URL(u.slice(0,i)).origin!==location.origin)return null;
}catch(e){return null;}
}

var s=u.slice(i+k.length);

try{return decodeURIComponent(s);}
catch(e){return s;}
}

if(/^https?:\/\//i.test(u)){
try{
var w=new URL(u);

if(w.origin===location.origin)return null;

for(var p=0;p<window.__gdProxyPass.length;p++)
if(w.hostname.indexOf(window.__gdProxyPass[p])>=0)return null;

return u;
}catch(e){return null;}
}

return null;
};

window.__gdProxyBuild=function(base,target){
if(base.indexOf("corsfix")>=0)return base+target;
return base+encodeURIComponent(target);
};

(function(){
var nativeFetch=window.fetch.bind(window);

function retryable(st){
return st===401||st===403||st===429||st===503;
}

function secret(init){
try{
var b=init&&init.body;
if(!b)return false;

var t=typeof b==="string"?b:new TextDecoder().decode(b);

return /(^|&)(gjp2?|password)=/.test(t);
}catch(e){
return false;
}
}

function attempt(input,init,target,form,idx){

if(idx>=0&&secret(init))
return Promise.reject(
new TypeError("login data is only sent through the site's own proxy")
);

if(idx<0){
return nativeFetch(input,init).then(function(res){

if(form){
if(res.status===404){
window.__gdProxyLocal=false;
return attempt(input,init,target,form,0);
}

window.__gdProxyLocal=true;
return res;
}

if(retryable(res.status))
return attempt(input,init,target,form,0);

return res;

},function(){

if(form)window.__gdProxyLocal=false;

return attempt(input,init,target,form,0);
});
}

var url=window.__gdProxyBuild(
window.__gdProxyBases[idx],
target
);

var out=(typeof input==="string")
?url
:((typeof Request!=="undefined")?new Request(url,input):url);

return nativeFetch(out,init).then(function(res){

if(retryable(res.status)&&idx<window.__gdProxyBases.length-1)
return attempt(input,init,target,form,idx+1);

window.__gdProxyBase=window.__gdProxyBases[idx];

return res;

},function(err){

if(idx<window.__gdProxyBases.length-1)
return attempt(input,init,target,form,idx+1);

throw err;
});
}

window.fetch=function(input,init){

var u=(typeof input==="string")?input:(input&&input.url);
var target=window.__gdProxyTarget(u);

if(target===null)
return nativeFetch(input,init);

var form=u.indexOf("/__proxy?url=")>=0;

var rest=function(){

if(form&&window.__gdProxyLocal===false)
return attempt(input,init,target,form,0);

return attempt(input,init,target,form,-1);
};

if(form&&window.__gdScramjetFetch&&!window.__gdScramjetOff){

return window.__gdScramjetFetch(target,init).then(
function(r){
window.__gdScramjetFails=0;
return r;
},
function(e){
console.warn("[scramjet] "+e);

window.__gdScramjetFails=(window.__gdScramjetFails|0)+1;

if(window.__gdScramjetFails>=3)
window.__gdScramjetOff=true;

return rest();
});
}

return rest();
};

var nativeOpen=XMLHttpRequest.prototype.open;

XMLHttpRequest.prototype.open=function(method,url){

if(typeof url==="string"){

var target=window.__gdProxyTarget(url);

if(target!==null){

var form=url.indexOf("/__proxy?url=")>=0;

if(!(form&&window.__gdProxyLocal!==false))
arguments[1]=window.__gdProxyBuild(
window.__gdProxyBase||window.__gdProxyBases[0],
target
);
}
}

return nativeOpen.apply(this,arguments);
};
})();
</script>

<script>
var consoleEl=document.getElementById('console');

try{
Error.stackTraceLimit=400;
}catch(e){}

var GD_DEBUG=/[?&]debug(=|&|$)/.test(location.search);

if(!GD_DEBUG){
try{
console.log=console.info=console.debug=function(){};
}catch(e){}
}

var logQueue=[];
var logScheduled=false;
window.gdLogRaw=[];

function flushLog(){
logScheduled=false;
}

function say(s){
if(!GD_DEBUG)return;
window.gdLogRaw.push(String(s));
}

var gdProg=0;
var gdProgDone=false;
var gdAssetDone={wasm:false,data:false};
var gdAssetsFell=false;

var loadPctEl=document.getElementById('loadPct');
var loadFillEl=document.getElementById('loadFill');

var GD_SIZE_HINT={
wasm:70192990,
data:314500859
};

var GD_SPLIT_COUNTS={
wasm:4,
data:15
};

function gdLoadSplitFile(which,onProgress){
var base=which==='wasm'?'gd_web.wasm':'gd_web.data';
var count=GD_SPLIT_COUNTS[which];
var chunks=[];
var loaded=0;

function loadPart(i){
if(i>count){
var total=0;
for(var x=0;x<chunks.length;x++)total+=chunks[x].byteLength;
var combined=new Uint8Array(total);
var offset=0;
for(var y=0;y<chunks.length;y++){
combined.set(chunks[y],offset);
offset+=chunks[y].byteLength;
}
return combined.buffer;
}
var url=base+'.part'+String(i).padStart(3,'0');
return fetch(url,{cache:'no-store'}).then(function(r){
if(!r.ok)throw new Error(url+' HTTP '+r.status);
return r.arrayBuffer();
}).then(function(buf){
var chunk=new Uint8Array(buf);
chunks.push(chunk);
loaded+=chunk.byteLength;
if(onProgress)onProgress(loaded,GD_SIZE_HINT[which]);
return loadPart(i+1);
});
}
return loadPart(1);
}

function gdInstallSplitFetch(){
var nativeFetch=window.fetch.bind(window);
window.fetch=function(input,init){
var u=typeof input==='string'?input:(input&&input.url)||'';
var clean=u.split('?')[0].split('#')[0];
if(clean==='gd_web.data'||clean.endsWith('/gd_web.data')){
return gdLoadSplitFile('data',function(loaded,total){
setAssetBar('data',loaded,total);
}).then(function(ab){
return new Response(ab,{
status:200,
headers:{
'Content-Type':'application/octet-stream',
'Content-Length':String(ab.byteLength)
}
});
});
}
return nativeFetch(input,init);
};
}

gdInstallSplitFetch();

function gdSizeHint(which){
return which==='wasm'?GD_SIZE_HINT.wasm:GD_SIZE_HINT.data;
}

var assetLoadedBytes={wasm:0,data:0};

function setAssetBar(which,loaded,total){
assetLoadedBytes[which]=loaded;
var totalWasm=GD_SIZE_HINT.wasm;
var totalData=GD_SIZE_HINT.data;
var totalCombined=totalWasm+totalData;
var currentCombined=assetLoadedBytes.wasm+assetLoadedBytes.data;
var p=Math.min(95,(currentCombined/totalCombined)*95);
setProgress(p);

var learned=gdLearnedSize(which);
var hint=gdSizeHint(which);
var known=hint>0?hint:(learned>0?learned:(total>0?total:0));
if(known>0&&loaded>=known){
gdAssetDone[which]=true;
try{
localStorage.setItem(which==='wasm'?'gdWasmSize':'gdDataSize',String(Math.max(loaded,known)));
}catch(e){}
}
if(gdAssetDone.wasm&&gdAssetDone.data)assetsDone();
}

function gdLearnedSize(which){
try{
return Number(localStorage.getItem(which==='wasm'?'gdWasmSize':'gdDataSize'))||0;
}catch(e){
return 0;
}
}

function forceAssetsDone(){
gdAssetDone.wasm=true;
gdAssetDone.data=true;
assetsDone();
}

function assetsDone(){
if(gdAssetsFell)return;
gdAssetsFell=true;
}

function bootDone(){}

function setProgress(p,exact){
if(gdProgDone&&p<100)return;
p=Math.max(0,Math.min(100,p));
if(p<gdProg&&!exact)return;
gdProg=p;
var rounded=Math.round(gdProg);
if(loadPctEl)loadPctEl.textContent=rounded+'%';
if(loadFillEl)loadFillEl.style.width=rounded+'%';
if(p>=100){
gdProgDone=true;
bootDone();
}
}

function resetProgress(){
gdProgDone=false;
gdProg=0;
gdAssetsFell=false;
gdAssetDone={wasm:false,data:false};
assetLoadedBytes={wasm:0,data:0};
if(loadPctEl)loadPctEl.textContent='0%';
if(loadFillEl)loadFillEl.style.width='0%';
}

window.gdFirstFrame=function(){
forceAssetsDone();
setProgress(100);
};

function gdProgressTick(){
if(!window.__gdLoadStarted||gdProgDone)return;
if(!gdAssetsFell){
var df=Module.dataFileDownloads;
if(df){
for(var k in df){
var e=df[k];
var which=/wasm/i.test(k)?'wasm':(/\.data/i.test(k)?'data':null);
if(which)setAssetBar(which,(e&&e.loaded)||0,(e&&e.total)||0);
}
}
}else if(gdProg<98){
setProgress(gdProg+0.5);
}
}

setInterval(gdProgressTick,200);

(function(){
var lastT=performance.now();
var lastN=0;
var primed=false;
function tick(now){
if(now-lastT>=500){
if(!window.__gdRuntimeReady){
lastT=now;
requestAnimationFrame(tick);
return;
}
var n=0;
try{
if(Module._gd_frames_get)n=Module._gd_frames_get()|0;
}catch(e){}
if(n>0){
lastN=n;
primed=true;
if(!window.__gdGotFrame){
window.__gdGotFrame=true;
setProgress(100);
}
}
lastT=now;
}
requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();

function restoreSaves(then){
var called=false;
function finish(){
if(!called){
called=true;
then();
}
}
setTimeout(finish,3000);
try{
var req=indexedDB.open('gdwasm_saves',1);
req.onupgradeneeded=function(){
req.result.createObjectStore('files');
};
req.onerror=function(){finish();};
req.onsuccess=function(){
var store,keysReq;
try{
store=req.result.transaction('files','readonly').objectStore('files');
keysReq=store.getAllKeys();
}catch(e){
finish();
return;
}
keysReq.onerror=finish;
keysReq.onsuccess=function(){
var keys=keysReq.result||[];
if(!keys.length){
finish();
return;
}
var pending=keys.length;
function one(){
if(--pending===0)finish();
}
keys.forEach(function(k){
var g=store.get(k);
g.onerror=one;
g.onsuccess=function(){
try{
if(g.result&&g.result.byteLength){
var s=String(k);
var base=s.indexOf('AppData/')===0?'/':'/Resources/';
var parts=s.split('/');
var cur=base.replace(/\/$/,'');
for(var pi=0;pi<parts.length-1;pi++){
cur+='/'+parts[pi];
try{Module.FS.stat(cur);}catch(e2){Module.FS.mkdir(cur);}
}
Module.FS.writeFile(base+s,new Uint8Array(g.result));
}
}catch(e){}
one();
};
});
};
};
}catch(e){
finish();
}
}

var Module={
canvas:document.getElementById('canvas'),
gdInputQueue:[],
gdCursorPos:[0,0],
locateFile:function(p){return p;},
get dataFileDownloads(){return this.__dfd;},
set dataFileDownloads(v){
if(this.__dfd===v)return;
this.__dfd=new Proxy(v||{},{
set:function(t,k,val){
t[k]=val;
try{
var which=/wasm/i.test(k)?'wasm':(/\.data/i.test(k)?'data':null);
if(which)setAssetBar(which,(val&&val.loaded)||0,(val&&val.total)||0);
}catch(e){}
return true;
}
});
},
instantiateWasm:function(imports,success){
gdLoadSplitFile('wasm',function(loaded,total){
Module.dataFileDownloads=Module.dataFileDownloads||{};
Module.dataFileDownloads['gd_web.wasm']={loaded:loaded,total:total};
setAssetBar('wasm',loaded,total);
}).then(function(ab){
try{
localStorage.setItem('gdWasmSize',String(ab.byteLength));
}catch(e){}
setAssetBar('wasm',ab.byteLength,GD_SIZE_HINT.wasm);
gdAssetDone.wasm=true;
return WebAssembly.instantiate(ab,imports);
}).then(function(r){
success(r.instance,r.module);
}).catch(function(e){
var ov=document.getElementById('errOverlay');
if(ov){
ov.textContent='Failed to load WASM parts: '+e;
ov.classList.add('on');
}
});
return {};
},
print:function(s){say(s);},
printErr:function(s){say(s);},
setStatus:function(t){
if(!t)return;
var m=/\((\d+)\/(\d+)\)/.exec(t);
if(m){
var total=+m[2]||1;
setProgress(+m[1]/total*78);
}else if(t.indexOf('Downloading')===0){
setProgress(4);
}else if(t.indexOf('Running')===0){
forceAssetsDone();
setProgress(80);
}else if(t.indexOf('Compiling')===0){
setProgress(76);
}
},
onRuntimeInitialized:function(){
window.__gdRuntimeReady=true;
if(!GD_DEBUG&&Module._gd_log_set)Module._gd_log_set(0);
if(/[?&]noauto/.test(location.search)&&Module._gd_autosave_set)Module._gd_autosave_set(0);
setProgress(85);
try{
Module.FS.chdir('/Resources');
}catch(e){}
setTimeout(function(){
restoreSaves(function(){
setProgress(92);
try{
const r=Module._gd_boot();
setProgress(96);
if(r&&typeof r.then==='function'){
r.then(function(){
setProgress(100);
}).catch(function(e){
var ov=document.getElementById('errOverlay');
if(ov){
ov.textContent='The game crashed ('+e+'). Reload the page.';
ov.classList.add('on');
}
});
}else{
setProgress(100);
}
}catch(e){}
});
},100);
}
};

var started=false;

function gdStart(){
if(started)return;
started=true;
window.__gdLoadStarted=true;
resetProgress();

var logoFly=document.getElementById('logoFly');
var loadFly=document.getElementById('loadFly');
var loadContainer=document.getElementById('loadContainer');

if(logoFly)logoFly.style.display='none';
if(loadFly)loadFly.style.display='none';
if(loadContainer)loadContainer.classList.add('active');

function loadModule(){
fetch('gd_web.js',{cache:'no-store'}).then(function(r){
if(!r.ok)throw new Error('HTTP '+r.status);
return r.text();
}).then(function(code){
var s=document.createElement('script');
s.textContent=code;
document.body.appendChild(s);
}).catch(function(e){
forceAssetsDone();
});
}
loadModule();

var checkReadyInterval=setInterval(function(){
if(window.__gdRuntimeReady&&window.__gdGotFrame){
clearInterval(checkReadyInterval);
setProgress(100);
var startEl=document.getElementById('start');
if(startEl){
startEl.classList.add('hide');
setTimeout(function(){
startEl.style.display='none';
window.__gdInputReady=true;
if(window.__gdAckFocus)window.__gdAckFocus();
},420);
}
}
},100);
}

document.getElementById('loadFly').addEventListener('click',gdStart);

document.addEventListener('keydown',function(e){
if(!started&&(e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter')){
e.preventDefault();
gdStart();
}
});
</script>

<script>
(function(){
const el=document.getElementById('canvas');
const WM_MOUSEMOVE=0x200, WM_LBUTTONDOWN=0x201, WM_LBUTTONUP=0x202, WM_RBUTTONDOWN=0x204, WM_RBUTTONUP=0x205, WM_MBUTTONDOWN=0x207, WM_MBUTTONUP=0x208;

function ready(){return window.__gdInputReady===true;}

function overCanvas(e){
var r;
if(!ready()||!el)return false;
if(e.target&&e.target.closest&&e.target.closest('#console,#start,#loadFly,a,button,input,textarea,select'))return false;
r=el.getBoundingClientRect();
return(e.clientX>=r.left&&e.clientX<r.right&&e.clientY>=r.top&&e.clientY<r.bottom);
}

function pos(e){
const r=el.getBoundingClientRect();
const x=Math.max(0,Math.min(1919,Math.round((e.clientX-r.left)*1920/r.width)));
const y=Math.max(0,Math.min(1079,Math.round((e.clientY-r.top)*1080/r.height)));
Module.gdCursorPos[0]=x;
Module.gdCursorPos[1]=y;
return((x&0xffff)|((y&0xffff)<<16));
}

function push(m,w,l){Module.gdInputQueue.push([m|0,w|0,l|0]); }

var ackedFocus=false;
function ackFocus(){
if(ackedFocus)return;
ackedFocus=true;
push(0x0006,1,0);
push(0x0007,0,0);
push(0x001c,1,0);
}
window.__gdAckFocus=ackFocus;

var gdButtonsDown=0;

window.addEventListener('mousedown',function(e){
if(!overCanvas(e))return;
var m=e.button===2?WM_RBUTTONDOWN:(e.button===1?WM_MBUTTONDOWN:WM_LBUTTONDOWN);
var w=e.button===2?2:(e.button===1?16:1);
gdButtonsDown|=(1<<e.button);
push(m,w,pos(e));
e.preventDefault();
});

window.addEventListener('mouseup',function(e){
if(!ready())return;
gdButtonsDown&=~(1<<e.button);
var m=e.button===2?WM_RBUTTONUP:(e.button===1?WM_MBUTTONUP:WM_LBUTTONUP);
push(m,0,pos(e));
push(WM_MOUSEMOVE,0,pos(e));
if(e.target===el)e.preventDefault();
});

window.addEventListener('mousemove',function(e){
if(!ready())return;
var q=Module.gdInputQueue;
var w=(e.buttons&1)?1:0;
var l=pos(e);
if(q.length&&q[q.length-1][0]===WM_MOUSEMOVE){
q[q.length-1]=[WM_MOUSEMOVE,w,l];
}else{
q.push([WM_MOUSEMOVE,w,l]);
}
});

window.addEventListener('wheel',function(e){
if(!overCanvas(e))return;
var lp=pos(e);
var dv=-e.deltaY;
var dh=e.deltaX;
if(Math.abs(dv)>=Math.abs(dh)){
var notch=dv>0?120:-120;
push(0x020A,(notch&0xFFFF)<<16,lp);
}else{
var hnotch=dh>0?-120:120;
push(0x020E,(hnotch&0xFFFF)<<16,lp);
}
e.preventDefault();
},{passive:false});

el.addEventListener('contextmenu',function(e){e.preventDefault();});
el.tabIndex=0;
el.addEventListener('mousedown',function(){el.focus();});

var VK={Escape:0x1B,Space:0x20,Enter:0x0D,Backspace:0x08,Tab:0x09,ArrowLeft:0x25,ArrowUp:0x26,ArrowRight:0x27,ArrowDown:0x28,KeyW:0x57,KeyA:0x41,KeyS:0x53,KeyD:0x44,KeyQ:0x51,KeyE:0x45,KeyR:0x52,KeyF:0x46,KeyP:0x50};
var SCAN={Escape:0x01,Space:0x39,Enter:0x1C,Backspace:0x0E,Tab:0x0F,ArrowLeft:0x4B,ArrowUp:0x48,ArrowRight:0x4D,ArrowDown:0x50,KeyW:0x11,KeyA:0x1E,KeyS:0x1F,KeyD:0x20,KeyQ:0x10,KeyE:0x12,KeyR:0x13,KeyF:0x21,KeyP:0x19};
var EXT={ArrowLeft:1,ArrowUp:1,ArrowRight:1,ArrowDown:1};

Module.gdKeyState=new Uint8Array(256);

function keyEvent(e,down){
if(!ready())return;
try{
if(window.getSelection&&String(window.getSelection())!=='')return;
}catch(err){}

var vk=VK[e.code]||e.keyCode||0;
if(down){
var ch=0;
if(e.key&&e.key.length===1)ch=e.key.charCodeAt(0);
else if(e.code==='Backspace')ch=0x08;
else if(e.code==='Enter')ch=0x0D;
if(ch){
var clp=1|((SCAN[e.code]||0)<<16);
if(EXT[e.code])clp|=0x1000000;
push(0x0102,ch,clp);
}
}
if(!vk)return;
Module.gdKeyState[vk&0xff]=down?1:0;
var scan=SCAN[e.code]||0;
var lp=1|(scan<<16);
if(EXT[e.code])lp|=0x1000000;
if(!down)lp|=-1073741824;
push(down?0x100:0x101,vk,lp);
if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
}

window.addEventListener('keydown',function(e){keyEvent(e,true);});
window.addEventListener('keyup',function(e){keyEvent(e,false);});
})();
</script>

<script>
(function(){
const el=document.getElementById('canvas');
function tPos(t){
var r=el.getBoundingClientRect();
var x=Math.max(0,Math.min(1919,Math.round((t.clientX-r.left)*1920/r.width)));
var y=Math.max(0,Math.min(1079,Math.round((t.clientY-r.top)*1080/r.height)));
try{
Module.gdCursorPos[0]=x;
Module.gdCursorPos[1]=y;
}catch(e){}
return((x&0xffff)|((y&0xffff)<<16));
}

function tOK(e){
if(window.__gdInputReady!==true)return false;
if(e.target&&e.target.closest&&e.target.closest('#console,#start,#loadFly,button,input,textarea,select'))return false;
return true;
}

if(el){
el.addEventListener('touchstart',function(e){
if(!tOK(e))return;
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i];
try{Module.gdInputQueue.push([0x201,1,tPos(t)]);}catch(_){}
}
try{el.focus();}catch(_){}
e.preventDefault();
},{passive:false});

el.addEventListener('touchmove',function(e){
if(!tOK(e))return;
e.preventDefault();
},{passive:false});

el.addEventListener('touchend',function(e){
if(window.__gdInputReady!==true)return;
for(var i=0;i<e.changedTouches.length;i++){
var t=e.changedTouches[i];
try{
Module.gdInputQueue.push([0x202,0,tPos(t)]);
Module.gdInputQueue.push([0x200,0,tPos(t)]);
}catch(_){}
}
e.preventDefault();
},{passive:false});

el.addEventListener('touchcancel',function(e){
if(window.__gdInputReady!==true)return;
try{
Module.gdInputQueue.push([0x202,0,(Module.gdCursorPos[0]&0xffff)|(Module.gdCursorPos[1]<<16)]);
}catch(_){}
e.preventDefault();
},{passive:false});
}
})();
</script>
